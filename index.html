<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hired Yet? Closed Beta</title>
<meta name="description" content="Hired Yet? is a job interview game. Sign up for the closed beta.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
:root{--ink:#33263f;--cream:#fffae6;--cream2:#efe6c4;--orange:#ff9e33;--yellow:#ffd94d;--wall:#c5baa3;--font:'Caveat','Segoe Print','Bradley Hand',cursive}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--font);font-weight:700;color:var(--ink);background:var(--wall);overflow-x:hidden}
main{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:clamp(16px,3vh,28px);padding:32px 20px}
.item{--r:0deg;position:relative;transform:rotate(var(--r));animation:in .45s cubic-bezier(.45,0,.55,1) both;animation-delay:calc(.15s + var(--i)*.08s);transition:transform .13s ease-out,background-color .13s,box-shadow .13s}
@keyframes in{from{opacity:0;translate:-140px 0}to{opacity:1;translate:0 0}}
.card{background:linear-gradient(180deg,#fffdf2,var(--cream) 45%,var(--cream2));border:5px solid var(--ink);box-shadow:inset 3px 3px 0 rgba(255,255,255,.9),inset -3px -3px 0 rgba(0,0,0,.16),9px 10px 0 rgba(0,0,0,.5);color:var(--ink);text-decoration:none}
a.card{display:flex;align-items:center;justify-content:center;cursor:pointer}
a.card:hover,a.card:focus-visible{background:linear-gradient(180deg,#ffe98a,var(--yellow));outline:none;transform:translateY(-5px) scale(1.07) rotate(calc(var(--r)*.2));box-shadow:inset 3px 3px 0 rgba(255,255,255,.9),inset -3px -3px 0 rgba(0,0,0,.16),13px 14px 0 rgba(0,0,0,.5)}
a.card:active{transform:scale(.97)}
a.card:focus-visible{outline:3px dashed var(--ink);outline-offset:6px}
.title{background:linear-gradient(180deg,#ffb457,var(--orange));border:5px solid var(--ink);padding:6px 36px 10px;box-shadow:inset 3px 3px 0 rgba(255,255,255,.55),inset -3px -3px 0 rgba(0,0,0,.18),9px 10px 0 rgba(0,0,0,.5)}
.title h1{font-size:clamp(46px,7vw,80px);line-height:1;color:#fff;letter-spacing:.5px;text-shadow:3px 3px 0 var(--ink),-3px 3px 0 var(--ink),3px -3px 0 var(--ink),-3px -3px 0 var(--ink),0 3px 0 var(--ink),3px 0 0 var(--ink)}
.desc{max-width:540px;padding:16px 24px 18px;font-size:clamp(23px,2.5vw,29px);line-height:1.18}
.desc b{display:block;font-size:1.25em;margin-bottom:4px}
.signup{width:min(100%,500px);height:84px;font-size:clamp(34px,4vw,42px)}
.download{width:min(100%,500px);height:84px;font-size:clamp(34px,4vw,42px);background:linear-gradient(180deg,#ffb457,var(--orange))}
.socials{display:flex;gap:22px;justify-content:center}
.ico{width:78px;height:78px}
.ico svg{width:44px;height:44px;fill:var(--ink)}
@media (prefers-reduced-motion:reduce){.item{animation:none;transition:none}}
</style>
</head>
<body>
<main>
  <div class="item title" style="--i:0;--r:-2.5deg"><h1>Hired Yet?</h1></div>
  <p class="item card desc" style="--i:1;--r:1.2deg"><b>A Job Interview Game</b>Fill in your résumé, wander a cozy town full of strangers, dogs and pigeons, and talk your way through the strangest job interviews of your life.</p>
  <a class="item card signup" id="signup" style="--i:2;--r:-1.6deg" href="#">Join the closed beta</a>
  <a class="item card download" id="download" style="--i:3;--r:1.4deg" href="#" target="_blank" rel="noopener">Download the game</a>
  <div class="socials">
    <a class="item card ico" id="discord" style="--i:4;--r:2deg" href="#" target="_blank" rel="noopener" aria-label="Join our Discord"><svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M5 5.6c2-1.3 4.2-1.8 4.2-1.8l.5 1c1.4-.2 3.2-.2 4.6 0l.5-1S17 4.300 19 5.600c2 3.300 2.800 6.900 2.500 10.600-1.600 1.300-3.200 2-4.700 2.400l-1.100-1.700c.6-.2 1.200-.5 1.700-.9-1.300.7-2.600 1-3.900 1s-2.600-.3-3.900-1c.5.4 1.100.7 1.700.9l-1.100 1.700c-1.500-.4-3.100-1.100-4.700-2.400C2.200 12.500 3 8.900 5 5.600ZM9 10.200a1.700 1.900 0 1 0 .1 0ZM15 10.200a1.700 1.900 0 1 0 .1 0Z"/></svg></a>
    <a class="item card ico" id="instagram" style="--i:5;--r:-1.5deg" href="#" target="_blank" rel="noopener" aria-label="Follow us on Instagram"><svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M7.500 2h9A5.500 5.500 0 0 1 22 7.500v9a5.500 5.500 0 0 1-5.500 5.500h-9A5.500 5.500 0 0 1 2 16.500v-9A5.500 5.500 0 0 1 7.500 2Zm0 2A3.500 3.500 0 0 0 4 7.500v9A3.500 3.500 0 0 0 7.500 20h9a3.500 3.500 0 0 0 3.500-3.500v-9A3.500 3.500 0 0 0 16.500 4ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Zm5.300-3.300a1.200 1.200 0 1 1 0 2.400 1.200 1.200 0 0 1 0-2.400Z"/></svg></a>
  </div>
</main>
<script>
/* ===== EDIT THESE LINKS ===== */
const LINKS = {
  signup:    "https://docs.google.com/forms/d/e/1FAIpQLSeSloFqfdC7zOVlnWnJiU2JdrwRrXoiCLKytg7gvd8rjXEacA/viewform?usp=header",
  download:  "https://hrishi-sarma.itch.io/hired-yet",
  discord:   "https://discord.gg/zjyvqxxPKj",
  instagram: "https://www.instagram.com/last_shift.dev"
};
for (const k in LINKS) document.getElementById(k).href = LINKS[k];

/* ===== plaster wall texture, ported from the game's "house_plaster" generator (StylizedMaterialFactory) ===== */
(function () {
  const S = 256, base = [0.85, 0.8, 0.7];                     // Small House wall colour
  const hash = (x, y, s) => { const n = Math.sin(x * 127.1 + y * 311.7 + s * 74.7) * 43758.5453; return n - Math.floor(n); };
  const sm = t => t * t * (3 - 2 * t);
  function noise(u, v, f, s) {                                 // tileable value noise
    const x = u * f, y = v * f, x0 = Math.floor(x), y0 = Math.floor(y), tx = sm(x - x0), ty = sm(y - y0);
    const g = (i, j) => hash(((i % f) + f) % f, ((j % f) + f) % f, s);
    return (g(x0, y0) * (1 - tx) + g(x0 + 1, y0) * tx) * (1 - ty) + (g(x0, y0 + 1) * (1 - tx) + g(x0 + 1, y0 + 1) * tx) * ty;
  }
  const c = document.createElement('canvas'); c.width = c.height = S;
  const ctx = c.getContext('2d'), img = ctx.createImageData(S, S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const u = x / S, v = y / S;
    const broad = noise(u, v, 7, 1), mid = noise(u, v, 43 > S / 4 ? 32 : 43, 2);
    const pores = noise(u, v, 96, 3), fine = noise(u, v, 192, 4);
    let val = 0.91 + (broad - 0.5) * 0.20 + (mid - 0.5) * 0.08;
    if (pores < 0.27 && fine < 0.58) val -= 0.10;
    if (pores > 0.77 && fine > 0.62) val += 0.045;
    val = Math.round(val * 15) / 15;
    const i = (y * S + x) * 4;
    img.data[i] = base[0] * val * 255; img.data[i + 1] = base[1] * val * 255; img.data[i + 2] = base[2] * val * 255; img.data[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  document.body.style.backgroundImage = 'url(' + c.toDataURL() + ')';
  document.body.style.backgroundSize = '384px 384px';
})();
</script>
</body>
</html>
